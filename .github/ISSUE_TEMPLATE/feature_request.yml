name: Feature proposal
description: Propose a capability or design change for discussion
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the observable capability and who benefits.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and operational considerations
      description: Identify trust boundaries, sensitive data, failure modes, or deployment impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

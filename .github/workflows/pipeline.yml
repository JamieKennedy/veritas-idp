name: Pipeline

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_staging_release:
        description: Confirm that this staging prerelease should be built and published
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  pr-policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate branch, title, and promotion metadata
        if: github.event_name == 'pull_request'
        run: node scripts/quality/validate-pr.mjs

      - name: Validate manual staging release request
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CONFIRMED: ${{ inputs.confirm_staging_release }}
        run: node scripts/release/validate-manual-release.mjs

      - name: Record push policy result
        if: github.event_name == 'push'
        run: echo "PR policy is not applicable to protected-branch push validation."

  repository-lint:
    name: Repository lint
    needs: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project registration
        run: pnpm check:structure

      - name: Verify generated routes
        run: pnpm check:generated

      - name: Verify release configuration
        run: pnpm check:release

      - name: Verify public metadata
        run: pnpm check:metadata

      - name: Check Markdown links
        run: pnpm check:links

      - name: Check repository formatting
        run: pnpm format:check:repository

      - name: Lint documentation
        run: pnpm lint:markdown

      - name: Validate Compose configuration
        run: pnpm check:compose

      - name: Set up Go for Actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@3fc49fb50d59c6ab7917a2e4195dba633e515b29 # v3.2.0
        with:
          dockerfile: src/backend/Dockerfile
          failure-threshold: warning

      - name: Lint Admin UI Dockerfile
        uses: hadolint/hadolint-action@3fc49fb50d59c6ab7917a2e4195dba633e515b29 # v3.2.0
        with:
          dockerfile: src/frontend/admin-ui/Dockerfile
          failure-threshold: warning

  security-scan:
    name: Secret scan
    needs: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Scan reachable Git history
        run: node scripts/security/scan-secrets.mjs

  backend-quality:
    name: Backend quality
    needs: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore Veritas.slnx --locked-mode

      - name: Verify C# formatting and code style
        run: >-
          dotnet format whitespace Veritas.slnx --verify-no-changes --no-restore &&
          dotnet format style Veritas.slnx --verify-no-changes --no-restore --severity warn

      - name: Build with analyzers and warnings as errors
        run: dotnet build Veritas.slnx --no-restore

      - name: Find the latest released v1 contract
        id: released-contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | jq -r '
            [.[][] | select(.draft == false and any(.assets[]; .name == "veritas-admin-api-v1.json"))]
            | ((map(select(.prerelease == false)) | first) // first)
            | .tag_name // empty')
          if [[ -n "$tag" ]]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern veritas-admin-api-v1.json --dir artifacts/baseline
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release has published a v1 contract yet."
          fi

      - name: Verify v1 compatibility
        if: steps.released-contract.outputs.available == 'true'
        uses: oasdiff/oasdiff-action/breaking@8bf13f088a1c9fd69292cb7694a35b0da07b5915 # v0
        with:
          base: artifacts/baseline/veritas-admin-api-v1.json
          revision: src/backend/edge/admin-api/Veritas.Admin.API/obj/Veritas.Admin.API.json
          fail-on: WARN

      - name: Run backend tests
        run: dotnet test Veritas.slnx --no-build --no-restore

      - name: Audit .NET dependencies
        shell: bash
        run: |
          dotnet list Veritas.slnx package --no-restore --vulnerable --include-transitive | tee dotnet-audit.txt
          ! grep -q "has the following vulnerable packages" dotnet-audit.txt

  frontend-quality:
    name: Frontend quality
    needs: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm --filter admin-ui format:check && pnpm --filter veritas-docs format:check

      - name: Lint frontend
        run: pnpm lint:frontend && pnpm lint:docs

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build:frontend

      - name: Run frontend tests
        run: pnpm test:frontend

      - name: Install documentation browser
        run: pnpm --filter veritas-docs exec playwright install --with-deps chromium

      - name: Run documentation browser tests
        run: pnpm --filter veritas-docs test:browser

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high

      - name: Upload documentation Pages artifact
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: src/docs/dist

  container-build:
    name: Container build
    needs: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/backend/Dockerfile
          load: true
          push: false
          tags: veritas-backend:quality

      - name: Build Admin UI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/frontend/admin-ui/Dockerfile
          load: true
          push: false
          tags: veritas-admin-ui:quality

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the administrator journey and migrator rerun
        env:
          VERITAS_TEST_USE_QUALITY_IMAGES: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter admin-ui exec playwright install --with-deps chromium
          pnpm check:admin-workflow

      - name: Verify backend entry points
        run: >-
          docker run --rm --entrypoint /bin/sh veritas-backend:quality -c
          "test -f /app/admin-api/Veritas.Admin.API.dll &&
          test -f /app/migrator/Veritas.Tooling.DbMigrator.dll"

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: veritas-backend:quality
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Scan Admin UI image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: veritas-admin-ui:quality
          exit-code: '1'
          severity: HIGH,CRITICAL

  release:
    name: Release
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging')
    needs:
      - pr-policy
      - repository-lint
      - security-scan
      - backend-quality
      - frontend-quality
      - container-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        env:
          CONTAINER_REGISTRY: ghcr.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  docs-deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

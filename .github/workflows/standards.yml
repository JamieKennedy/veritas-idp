name: Standards

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET dependencies
        run: dotnet restore Veritas.slnx

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical checks
        run: pnpm check

      - name: Audit .NET dependencies
        shell: bash
        run: |
          dotnet list Veritas.slnx package --vulnerable --include-transitive | tee dotnet-audit.txt
          ! grep -q "has the following vulnerable packages" dotnet-audit.txt

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high
